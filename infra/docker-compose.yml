# 需脉枢纽 PoC 编排（架构 11.2 / M8 T8.3）：PG + Milvus + 后端 api + 前端 web
# 一键：cd infra && cp .env.example .env（填 LLM/Embedding Key）&& docker compose up -d --build
# 访问：http://localhost（买家/厂商端） / http://localhost/admin/（管理后台） / http://localhost/api/v1/...
name: xmsn-demo

services:
  postgres:
    image: postgres:16
    container_name: xmsn-postgres
    environment:
      POSTGRES_USER: xumai
      POSTGRES_PASSWORD: xumai
      POSTGRES_DB: xumai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xumai -d xumai"]
      interval: 5s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: xmsn-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # metrics
    volumes:
      - milvusdata:/var/lib/milvus

  api:
    build:
      context: ../backend
    container_name: xmsn-api
    env_file: .env
    environment:
      # 服务间连接用 compose 服务名（覆盖 .env 里的 localhost 占位）
      DATABASE_URL: postgresql+asyncpg://xumai:xumai@postgres:5432/xumai
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../frontend
    container_name: xmsn-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  milvusdata:
  uploads:
