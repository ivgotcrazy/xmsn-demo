# 需脉枢纽 Nginx（M8 T8.2/T8.3）：user-web 根路径 + admin-web /admin/ + /api 反代。
# 挂载为 web 容器 /etc/nginx/conf.d/default.conf（compose volume，单一份源码）。
# 静态产物：/usr/share/nginx/html/user（user-web）、/usr/share/nginx/html/admin（admin-web）。
# upstream api 为 compose 服务名（后端 :8000）。
server {
    listen 80;
    server_name _;

    # 买家/厂商端（user-web，根路径）
    root /usr/share/nginx/html/user;
    index index.html;

    # 管理后台（admin-web，vite base=/admin/）
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API 反向代理（SSE 流式：proxy_buffering off）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 健康检查（精确匹配）
    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # API 文档（后端 FastAPI docs/redoc/openapi）
    location = /docs {
        proxy_pass http://api:8000/docs;
    }
    location = /redoc {
        proxy_pass http://api:8000/redoc;
    }
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # 前端 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
