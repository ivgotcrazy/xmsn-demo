# 需脉枢纽 Nginx 骨架（架构 11.2）：前端静态 + 反向代理 API。
# PoC 阶段由后端应用直接服务 /docs 与 /healthz；正式演示时 Nginx 承担 SSL 与转发。
server {
    listen 80;
    server_name _;

    # 前端（user-web / admin-web 构建产物挂载）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 流式（对话 Agent）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}
